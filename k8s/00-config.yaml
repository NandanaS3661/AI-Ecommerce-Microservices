apiVersion: v1
kind: Namespace
metadata:
  name: ai-ecommerce
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ai-ecommerce
data:
  MYSQL_HOST: mysql
  MYSQL_DATABASE: ecommerce
  MYSQL_USER: appuser
  MONGO_URL: mongodb://mongodb:27017
  MONGO_DATABASE: ecommerce_ai
  USER_URL: http://user-service:8001
  PRODUCT_URL: http://product-service:8002
  ORDER_URL: http://order-service:8003
  INVENTORY_URL: http://inventory-service:8004
  RECOMMEND_URL: http://recommendation-service:8005
  AI_URL: http://ai-service:8006
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: ai-ecommerce
type: Opaque
stringData:
  MYSQL_PASSWORD: apppass
  MYSQL_ROOT_PASSWORD: rootpass

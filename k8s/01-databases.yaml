apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: ai-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports: [{containerPort: 3306}]
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom: {secretKeyRef: {name: db-secret, key: MYSQL_ROOT_PASSWORD}}
        - {name: MYSQL_DATABASE, value: ecommerce}
        - {name: MYSQL_USER, value: appuser}
        - name: MYSQL_PASSWORD
          valueFrom: {secretKeyRef: {name: db-secret, key: MYSQL_PASSWORD}}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ai-ecommerce
spec:
  selector: {app: mysql}
  ports: [{port: 3306, targetPort: 3306}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: ai-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels: {app: mongodb}
  template:
    metadata:
      labels: {app: mongodb}
    spec:
      containers:
      - name: mongodb
        image: mongo:7
        ports: [{containerPort: 27017}]
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: ai-ecommerce
spec:
  selector: {app: mongodb}
  ports: [{port: 27017, targetPort: 27017}]

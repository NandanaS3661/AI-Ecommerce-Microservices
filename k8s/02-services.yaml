---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ai-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels: {app: user-service}
  template:
    metadata:
      labels: {app: user-service}
    spec:
      containers:
      - name: user-service
        image: ai-ecommerce-user-service:latest
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8001}]
        envFrom:
        - configMapRef: {name: app-config}
        - secretRef: {name: db-secret}
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ai-ecommerce
spec:
  selector: {app: user-service}
  ports: [{port: 8001, targetPort: 8001}]

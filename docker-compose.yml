services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql, ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 15
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  user-service:
    build: ./services/user-service
    environment: &mysql_env {MYSQL_HOST: mysql, MYSQL_USER: appuser, MYSQL_PASSWORD: apppass, MYSQL_DATABASE: ecommerce}
    depends_on: {mysql: {condition: service_healthy}}
  product-service:
    build: ./services/product-service
    environment: *mysql_env
    depends_on: {mysql: {condition: service_healthy}}
  order-service:
    build: ./services/order-service
    environment: *mysql_env
    depends_on: {mysql: {condition: service_healthy}}
  inventory-service:
    build: ./services/inventory-service
    environment: *mysql_env
    depends_on: {mysql: {condition: service_healthy}}
  recommendation-service:
    build: ./services/recommendation-service
    environment: *mysql_env
    depends_on: {mysql: {condition: service_healthy}}
  ai-service:
    build: ./services/ai-service
    environment: {MONGO_URL: mongodb://mongodb:27017, MONGO_DATABASE: ecommerce_ai}
    depends_on: [mongodb]
  api-gateway:
    build: ./services/api-gateway
    ports: ["8000:8000"]
    environment:
      USER_URL: http://user-service:8001
      PRODUCT_URL: http://product-service:8002
      ORDER_URL: http://order-service:8003
      INVENTORY_URL: http://inventory-service:8004
      RECOMMEND_URL: http://recommendation-service:8005
      AI_URL: http://ai-service:8006
    depends_on: [user-service,product-service,order-service,inventory-service,recommendation-service,ai-service]
  frontend:
    build: ./frontend
    ports: ["8501:8501"]
    depends_on: [api-gateway]
volumes:
  mysql_data:
  mongo_data:
